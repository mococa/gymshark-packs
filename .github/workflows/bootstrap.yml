name: Bootstrap

# One-time setup workflow. Run this before the first deploy.
#
# Prerequisites (run locally once before triggering this):
#   bash scripts/setup-oidc.sh <github-username> <repo-name>
#   → add the printed AWS_ROLE_ARN as a GitHub secret
#
# After this workflow completes:
#   1. Copy the values from the job summary and add them as GitHub secrets
#   2. If a domain was provided, add the CNAME record to your DNS provider
#   3. Wait for the certificate to become ISSUED, then push to main to deploy

on:
  workflow_dispatch:
    inputs:
      domain_name:
        description: 'Custom domain (e.g. gymshark-challenge.moureau.dev). Leave empty to skip ACM certificate.'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  bootstrap:
    name: Bootstrap Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/bootstrap

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          DOMAIN_NAME: ${{ inputs.domain_name }}
        run: |
          if [ -n "$DOMAIN_NAME" ]; then
            terraform apply -auto-approve -var="domain_name=$DOMAIN_NAME"
          else
            terraform apply -auto-approve
          fi

      - name: Print outputs
        run: |
          STATE_BUCKET=$(terraform output -raw state_bucket)
          LOCK_TABLE=$(terraform output -raw lock_table)
          CERT_ARN=$(terraform output -raw certificate_arn 2>/dev/null || echo "")

          echo "## Bootstrap complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Step 1 — Add these GitHub repository secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`TF_STATE_BUCKET\` | \`$STATE_BUCKET\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`TF_STATE_LOCK_TABLE\` | \`$LOCK_TABLE\` |" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ inputs.domain_name }}" ] && [ "$CERT_ARN" != "no domain configured" ]; then
            CNAME_NAME=$(terraform output -json certificate_validation_cname | jq -r '.name')
            CNAME_VALUE=$(terraform output -json certificate_validation_cname | jq -r '.value')

            echo "| \`ACM_CERTIFICATE_ARN\` | \`$CERT_ARN\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Step 2 — Validate the ACM certificate" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Add this CNAME to your DNS provider (proxy **off**):" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Type | \`CNAME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Name | \`$CNAME_NAME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Value | \`$CNAME_VALUE\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Wait for the certificate status to become **ISSUED**, then proceed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Step 3 — Deploy" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Push to \`main\` to trigger the deploy workflow." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Step 2 — Deploy" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Push to \`main\` to trigger the deploy workflow." >> $GITHUB_STEP_SUMMARY
          fi
